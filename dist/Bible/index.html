<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><title>Bible Studio · 圣经研读</title><style>
:root{--bg:#f7f5ef;--panel:#fffefa;--ink:#252b29;--muted:#7d8580;--line:#e6e8e0;--accent:#487765;--soft:#eaf2ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body.dark{--bg:#151b1a;--panel:#202927;--ink:#eaf0ec;--muted:#9aaca4;--line:#34413b;--accent:#9bd5b8;--soft:#2b4037}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}.brand{font-size:19px;font-weight:750;letter-spacing:-.5px}.brand span{color:var(--accent)}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1280px;margin:auto;min-height:calc(100dvh - 62px)}aside{border-right:1px solid var(--line);padding:24px 16px}.small{font-size:12px;color:var(--muted);letter-spacing:1px;margin:12px}.books{display:grid;grid-template-columns:1fr 1fr;gap:6px}.books button,.toolbar button,.icon,.nav button{background:transparent;border:0;color:var(--ink);border-radius:11px;padding:10px}.books button{text-align:left;font-size:13px}.books button.active,.books button:hover,.nav button.active{background:var(--soft);color:var(--accent)}main{padding:28px clamp(18px,5vw,80px) 110px;max-width:900px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:2px}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(32px,5vw,48px);font-weight:600;margin:12px 0 20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:25px}.toolbar select,.toolbar button,.search input,.note textarea{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:10px 12px}.verses{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:19px;line-height:2.05}.verse{padding:6px 10px;border-radius:10px;transition:background .15s}.verse:active,.verse:hover{background:var(--soft)}sup{font-family:system-ui;font-size:11px;color:var(--accent);padding-right:9px}.status{color:var(--muted);font-size:14px;line-height:1.8}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{font-size:12px;min-width:70px;display:flex;flex-direction:column;gap:3px;align-items:center}.nav b{font-size:20px;font-weight:400}.panel{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:16px;margin:12px 0}.search input{width:100%}.note textarea{width:100%;min-height:100px;resize:vertical}.action{background:var(--accent)!important;color:var(--bg)!important;border:0;border-radius:10px;padding:10px 15px}.hidden{display:none}.booktoggle{display:none}.mobilebooks{display:none}@media(max-width:760px){header{height:55px;padding:0 16px}.layout{display:block}aside{display:none}main{padding:22px 16px 110px}.booktoggle{display:inline-block}.mobilebooks{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;max-height:45dvh;overflow:auto}.mobilebooks.hidden{display:none}.verses{font-size:18px;line-height:1.95}.toolbar select{max-width:45vw}.nav{bottom:0}h1{margin-top:10px}}@media(min-width:761px){.nav{left:auto;right:18px;bottom:20px;border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 8px 30px #0001}.mobilebooks{display:none!important}} .sheet{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet.hidden{display:none}.sheetbox{width:min(100%,550px);background:var(--panel);color:var(--ink);padding:20px 20px calc(25px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -10px 40px #0002}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheetbox p{font-family:Georgia,"Songti SC",serif;line-height:1.9}.sheetactions{display:flex;gap:10px;margin:12px 0}.sheetactions button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:10px 14px}.sheetbox textarea{display:block;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.verse{cursor:pointer}.toolbar{position:relative}.verses{font-size:var(--reader-size,19px)}@media(max-width:760px){.verses{font-size:var(--reader-size,18px)}.toolbar{gap:5px}.toolbar button,.toolbar select{padding:9px 8px;font-size:13px}.sheetbox{max-height:80dvh;overflow:auto}} </style></head><body><header><div class="brand">✦ Bible <span>Studio</span></div><div><button class="icon" id="theme" aria-label="切换深色模式">◐</button></div></header><div class="layout"><aside><div class="small">旧约 · OLD TESTAMENT</div><div id="ot" class="books"></div><div class="small">新约 · NEW TESTAMENT</div><div id="nt" class="books"></div></aside><main><section id="reader"><div class="top"><div class="eyebrow">READ · REFLECT · GROW</div><button class="booktoggle icon" id="booktoggle">☷ 目录</button></div><div class="mobilebooks hidden" id="mobilebooks"><div class="small">旧约</div><div id="mot" class="books"></div><div class="small">新约</div><div id="mnt" class="books"></div></div><h1 id="heading">创世记 · 第 1 章</h1><div class="toolbar"><button id="prev">← 上一章</button><select id="chapter" aria-label="选择章节"></select><button id="next">下一章 →</button><button id="fontminus" aria-label="缩小字号">A−</button><button id="fontplus" aria-label="放大字号">A＋</button></div><div id="verses" class="verses"><p class="status">正在加载经文…</p></div><p class="status" id="source">经文：中文和合本（简体） · 阅读数据优先从本站加载</p></section><section id="searchview" class="hidden"><div class="eyebrow">FIND</div><h1>经文查找</h1><div class="panel"><p class="status">输入经文位置，例如 John 3:16、Genesis 1 或 Psalm 23。当前版本支持按位置查找；全文关键词索引将在后续版本提供。</p><div class="search"><input id="query" placeholder="John 3:16"></div><p><button class="action" id="go">打开经文</button></p></div></section><section id="savedview" class="hidden"><div class="eyebrow">YOUR LIBRARY</div><h1>我的收藏</h1><div id="saved"></div></section><section id="notesview" class="hidden"><div class="eyebrow">JOURNAL</div><h1>研读笔记</h1><div id="notes"></div></section></main></div><nav class="nav"><button data-view="reader" class="active"><b>▤</b>阅读</button><button data-view="searchview"><b>⌕</b>查找</button><button data-view="savedview"><b>♡</b>收藏</button><button data-view="notesview"><b>✎</b>笔记</button></nav><div id="verseSheet" class="sheet hidden" role="dialog" aria-label="经文操作"><div class="sheetbox"><div class="sheethead"><strong id="sheetRef">经文</strong><button class="icon" id="closeSheet">✕</button></div><p id="sheetText"></p><div class="sheetactions"><button id="saveVerse">♡ 收藏</button><button id="copyVerse">复制经文</button></div><textarea id="sheetNote" placeholder="记录你的研读心得…" rows="3"></textarea><button class="action" id="saveNote">保存笔记</button></div></div><script>
const names='创世记,出埃及记,利未记,民数记,申命记,约书亚记,士师记,路得记,撒母耳记上,撒母耳记下,列王纪上,列王纪下,历代志上,历代志下,以斯拉记,尼希米记,以斯帖记,约伯记,诗篇,箴言,传道书,雅歌,以赛亚书,耶利米书,耶利米哀歌,以西结书,但以理书,何西阿书,约珥书,阿摩司书,俄巴底亚书,约拿书,弥迦书,那鸿书,哈巴谷书,西番雅书,哈该书,撒迦利亚书,玛拉基书,马太福音,马可福音,路加福音,约翰福音,使徒行传,罗马书,哥林多前书,哥林多后书,加拉太书,以弗所书,腓立比书,歌罗西书,帖撒罗尼迦前书,帖撒罗尼迦后书,提摩太前书,提摩太后书,提多书,腓利门书,希伯来书,雅各书,彼得前书,彼得后书,约翰一书,约翰二书,约翰三书,犹大书,启示录'.split(',');
const eng='Genesis,Exodus,Leviticus,Numbers,Deuteronomy,Joshua,Judges,Ruth,1 Samuel,2 Samuel,1 Kings,2 Kings,1 Chronicles,2 Chronicles,Ezra,Nehemiah,Esther,Job,Psalms,Proverbs,Ecclesiastes,Song of Solomon,Isaiah,Jeremiah,Lamentations,Ezekiel,Daniel,Hosea,Joel,Amos,Obadiah,Jonah,Micah,Nahum,Habakkuk,Zephaniah,Haggai,Zechariah,Malachi,Matthew,Mark,Luke,John,Acts,Romans,1 Corinthians,2 Corinthians,Galatians,Ephesians,Philippians,Colossians,1 Thessalonians,2 Thessalonians,1 Timothy,2 Timothy,Titus,Philemon,Hebrews,James,1 Peter,2 Peter,1 John,2 John,3 John,Jude,Revelation'.split(',');
const counts=[50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];let state=JSON.parse(localStorage.getItem('bible-studio-state')||'{}');let book=Number.isInteger(state.book)?state.book:0,chapter=state.chapter||1;const $=id=>document.getElementById(id),store=()=>localStorage.setItem('bible-studio-state',JSON.stringify(state));let currentVerses=[];let activeVerse=null;const osis='Gen Exod Lev Num Deut Josh Judg Ruth 1Sam 2Sam 1Kgs 2Kgs 1Chr 2Chr Ezra Neh Esth Job Ps Prov Eccl Song Isa Jer Lam Ezek Dan Hos Joel Amos Obad Jonah Mic Nah Hab Zeph Hag Zech Mal Matt Mark Luke John Acts Rom 1Cor 2Cor Gal Eph Phil Col 1Thess 2Thess 1Tim 2Tim Titus Phlm Heb Jas 1Pet 2Pet 1John 2John 3John Jude Rev'.split(' ');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function books(){for(let i=0;i<66;i++){for(let id of [i<39?'ot':'nt',i<39?'mot':'mnt']){let b=document.createElement('button');b.textContent=names[i];b.className=i===book?'active':'';b.onclick=()=>{book=i;chapter=1;$('mobilebooks').classList.add('hidden');load()};$(id).append(b)}}}
function setChapter(){let el=$('chapter');el.innerHTML='';for(let i=1;i<=counts[book];i++){let o=document.createElement('option');o.value=i;o.textContent='第 '+i+' 章';el.append(o)}el.value=chapter}
async function load(){state.book=book;state.chapter=chapter;store();$('heading').textContent=names[book]+' · 第 '+chapter+' 章';setChapter();document.querySelectorAll('.books').forEach(e=>[...e.children].forEach((b,i)=>b.classList.toggle('active',i+(e.id==='nt'||e.id==='mnt'?39:0)===book)));$('verses').innerHTML='<p class="status">正在加载经文…</p>';const v='cuvs',file=osis[book];const paths=['./data/'+file+'.json'];try{let data;for(const path of paths){try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);let r;try{r=await fetch(path,{signal:controller.signal,cache:'no-cache'})}finally{clearTimeout(timer)}if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();break}catch(e){}}if(!data||!Array.isArray(data.chapters))throw Error('未取得经文');const ch=data.chapters.find(c=>Number(c.chapter)===chapter)||data.chapters[chapter-1];if(!ch||!Array.isArray(ch.verses))throw Error('本章暂无数据');currentVerses=ch.verses.map(x=>({verse:x.number,text:x.text}));$('verses').innerHTML='';for(const item of currentVerses){const el=document.createElement('div');el.className='verse';el.innerHTML='<sup>'+item.verse+'</sup>'+escapeHTML(item.text);el.onclick=()=>verseAction(item);$('verses').append(el)}}catch(e){$('verses').innerHTML='<div class="panel status">中文经文尚未准备好或网络异常，请稍后重试。<br><button class="action" id="retry">重新加载</button></div>';$('retry').onclick=load}window.scrollTo({top:0,behavior:'instant')}
function verseAction(v){activeVerse={key:eng[book]+' '+chapter+':'+v.verse,text:v.text};$('sheetRef').textContent=names[book]+' '+chapter+':'+v.verse;$('sheetText').textContent=v.text;const saved=JSON.parse(localStorage.getItem('bible-studio-saved')||'{}'),notes=JSON.parse(localStorage.getItem('bible-studio-notes')||'{}');$('saveVerse').textContent=saved[activeVerse.key]?'♥ 已收藏':'♡ 收藏';$('sheetNote').value=notes[activeVerse.key]||'';$('verseSheet').classList.remove('hidden')}
$('closeSheet').onclick=()=>$('verseSheet').classList.add('hidden');$('verseSheet').onclick=e=>{if(e.target===$('verseSheet'))$('closeSheet').click()};$('saveVerse').onclick=()=>{if(!activeVerse)return;const saved=JSON.parse(localStorage.getItem('bible-studio-saved')||'{}');if(saved[activeVerse.key])delete saved[activeVerse.key];else saved[activeVerse.key]=activeVerse.text;localStorage.setItem('bible-studio-saved',JSON.stringify(saved));$('saveVerse').textContent=saved[activeVerse.key]?'♥ 已收藏':'♡ 收藏'};$('copyVerse').onclick=async()=>{if(activeVerse){try{await navigator.clipboard.writeText(activeVerse.key+' '+activeVerse.text);$('copyVerse').textContent='已复制'}catch(e){$('copyVerse').textContent='复制失败'}}};$('saveNote').onclick=()=>{if(!activeVerse)return;const notes=JSON.parse(localStorage.getItem('bible-studio-notes')||'{}');const v=$('sheetNote').value.trim();if(v)notes[activeVerse.key]=v;else delete notes[activeVerse.key];localStorage.setItem('bible-studio-notes',JSON.stringify(notes));$('closeSheet').click()};
function view(id){['reader','searchview','savedview','notesview'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='savedview')renderEntries('saved','bible-studio-saved');if(id==='notesview')renderEntries('notes','bible-studio-notes')}
function renderEntries(id,key){let data=JSON.parse(localStorage.getItem(key)||'{}');$(id).innerHTML=Object.keys(data).length?Object.entries(data).map(([k,v])=>'<div class="panel"><strong>'+escapeHTML(k)+'</strong><p>'+escapeHTML(v)+'</p></div>').join(''):'<p class="status">还没有记录。阅读时点击任意经节即可收藏或添加笔记。</p>'}
$('prev').onclick=()=>{if(chapter>1)chapter--;else if(book>0){book--;chapter=counts[book]}load()};$('next').onclick=()=>{if(chapter<counts[book])chapter++;else if(book<65){book++;chapter=1}load()};$('chapter').onchange=e=>{chapter=+e.target.value;load()};$('booktoggle').onclick=()=>$('mobilebooks').classList.toggle('hidden');$('theme').onclick=()=>{document.body.classList.toggle('dark');state.dark=document.body.classList.contains('dark');store()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));$('go').onclick=()=>{let q=$('query').value.trim();let match=q.match(/^(.+?)\s+(\d+)(?::(\d+))?$/);if(!match){alert('请输入类似 John 3:16 的经文位置');return}let idx=eng.findIndex(n=>n.toLowerCase()===match[1].toLowerCase());if(idx<0||+match[2]<1||+match[2]>counts[idx]){alert('暂不支持该书卷名称或章节，请输入英文书名');return}book=idx;chapter=+match[2];view('reader');load()};$('fontminus').onclick=()=>{state.font=Math.max(15,(state.font||18)-1);document.documentElement.style.setProperty('--reader-size',state.font+'px');store()};$('fontplus').onclick=()=>{state.font=Math.min(28,(state.font||18)+1);document.documentElement.style.setProperty('--reader-size',state.font+'px');store()};if(state.font)document.documentElement.style.setProperty('--reader-size',state.font+'px');if(state.dark)document.body.classList.add('dark');books();load();
</script></body></html>
