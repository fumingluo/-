name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # A new push creates a fresh workflow run with a single Pages artifact.
      - name: Verify Bible Studio is included
        run: |
          test -s dist/index.html
          test -s dist/Bible/index.html
          echo 'Bible Studio exists in deploy artifact'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact to become discoverable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            echo "Pages artifact count: ${count} (attempt ${attempt})"
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo 'Pages artifact not discoverable after retries' >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
