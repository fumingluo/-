name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore event images
        shell: bash
        run: |
          mkdir -p dist/assets
          base="https://longhua-reading-club-1121.fumingluo06.chatgpt.site/assets"
          for file in cover-note.jpg discussion.jpg group.jpg wechat-qr.jpg; do
            if [[ ! -f "dist/assets/$file" ]]; then
              curl --fail --location --retry 3 "$base/$file" -o "dist/assets/$file"
            fi
          done
      - name: Save images to the repository
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- dist/assets)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/assets
            git commit -m "Add event images"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

